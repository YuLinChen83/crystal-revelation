<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- 背景：純白色 -->
  <rect width="600" height="600" fill="#ffffff" />
  
  <defs>
    <!-- 軟陰影漸層 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- 基礎 3D 遮罩，把內含物限制在圓圈內 -->
    <clipPath id="beadClip">
      <circle cx="300" cy="270" r="190" />
    </clipPath>
    
    <!-- 高光與立體感的 3D 覆蓋漸層 -->
    <radialGradient id="sphere3DGrad" cx="28%" cy="23%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="82%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
    </radialGradient>

    <!-- 高光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
    <radialGradient id="crystalBaseGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f5f6fa" />
      <stop offset="100%" stop-color="#e1e5eb" />
    </radialGradient>
      </defs>

  <!-- 軟陰影 -->
  <ellipse cx="300" cy="485" rx="140" ry="18" fill="url(#shadowGrad)" />

  <!-- 圓珠主體 -->
  <g clip-path="url(#beadClip)">
    <!-- 1. 基礎色 -->
    <circle cx="300" cy="270" r="190" fill="url(#crystalBaseGrad)" />
    
    <!-- 2. 特有的包體/紋理 -->
    <line x1="331.9807709880479" y1="359.2606493380299" x2="295.49203747455977" y2="347.9550996402577" stroke="#2c3e50" stroke-width="1.240132773393725" opacity="0.65" stroke-linecap="round"/>
<line x1="331.9807709880479" y1="359.2606493380299" x2="269.9108867144787" y2="283.76101704699977" stroke="#2c3e50" stroke-width="2.2881706119151204" opacity="0.65" stroke-linecap="round"/>
<line x1="185.84559992559662" y1="256.2950051021471" x2="221.5089736320806" y2="331.2772826292712" stroke="#2c3e50" stroke-width="1.7032037240760474" opacity="0.65" stroke-linecap="round"/>
<line x1="185.84559992559662" y1="256.2950051021471" x2="198.16907757749505" y2="185.273269714271" stroke="#2c3e50" stroke-width="2.0055019548963173" opacity="0.65" stroke-linecap="round"/>
<line x1="185.84559992559662" y1="256.2950051021471" x2="269.9108867144787" y2="283.76101704699977" stroke="#2c3e50" stroke-width="1.2811458937476345" opacity="0.65" stroke-linecap="round"/>
<line x1="185.84559992559662" y1="256.2950051021471" x2="158.4755850768488" y2="329.08313565232675" stroke="#2c3e50" stroke-width="1.6588328822426774" opacity="0.65" stroke-linecap="round"/>
<line x1="295.49203747455977" y1="347.9550996402577" x2="221.5089736320806" y2="331.2772826292712" stroke="#2c3e50" stroke-width="1.0241880247081099" opacity="0.65" stroke-linecap="round"/>
<line x1="295.49203747455977" y1="347.9550996402577" x2="269.9108867144787" y2="283.76101704699977" stroke="#2c3e50" stroke-width="2.002622757383506" opacity="0.65" stroke-linecap="round"/>
<line x1="440.33877386798395" y1="343.7095266880715" x2="449.1223152960174" y2="283.79483684677325" stroke="#2c3e50" stroke-width="1.7993551657300486" opacity="0.65" stroke-linecap="round"/>
<line x1="221.5089736320806" y1="331.2772826292712" x2="269.9108867144787" y2="283.76101704699977" stroke="#2c3e50" stroke-width="1.0718733063040418" opacity="0.65" stroke-linecap="round"/>
<line x1="221.5089736320806" y1="331.2772826292712" x2="158.4755850768488" y2="329.08313565232675" stroke="#2c3e50" stroke-width="2.155361457004801" opacity="0.65" stroke-linecap="round"/>

    <!-- 3. 反光與3D陰影層 -->
    <circle cx="300" cy="270" r="190" fill="url(#sphere3DGrad)" style="mix-blend-mode: multiply;" />
  </g>
  
  <!-- 4. 高光 (Highlight) -->
  <ellipse cx="230" cy="180" rx="65" ry="38" transform="rotate(-30 230 180)" fill="#ffffff" opacity="0.65" filter="url(#glow)" />
  <circle cx="200" cy="150" r="15" fill="#ffffff" opacity="0.4" filter="url(#glow)" />
</svg>