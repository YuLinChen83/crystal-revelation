<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- 背景：純白色 -->
  <rect width="600" height="600" fill="#ffffff" />
  
  <defs>
    <!-- 軟陰影漸層 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- 基礎 3D 遮罩，把內含物限制在圓圈內 -->
    <clipPath id="beadClip">
      <circle cx="300" cy="270" r="190" />
    </clipPath>
    
    <!-- 高光與立體感的 3D 覆蓋漸層 -->
    <radialGradient id="sphere3DGrad" cx="28%" cy="23%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="82%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
    </radialGradient>

    <!-- 高光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
    <radialGradient id="crystalBaseGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff0f5" />
      <stop offset="50%" stop-color="#ffb8b8" />
      <stop offset="100%" stop-color="#b967f0" />
    </radialGradient>
      </defs>

  <!-- 軟陰影 -->
  <ellipse cx="300" cy="485" rx="140" ry="18" fill="url(#shadowGrad)" />

  <!-- 圓珠主體 -->
  <g clip-path="url(#beadClip)">
    <!-- 1. 基礎色 -->
    <circle cx="300" cy="270" r="190" fill="url(#crystalBaseGrad)" />
    
    <!-- 2. 特有的包體/紋理 -->
    <line x1="160" y1="70" x2="160" y2="470" stroke="#ffffff" stroke-width="1.2" opacity="0.2" />
<line x1="185" y1="70" x2="185" y2="470" stroke="#ffffff" stroke-width="1.2" opacity="0.2" />
<line x1="210" y1="70" x2="210" y2="470" stroke="#ffffff" stroke-width="1.2" opacity="0.2" />
<line x1="235" y1="70" x2="235" y2="470" stroke="#ffffff" stroke-width="1.2" opacity="0.2" />
<line x1="260" y1="70" x2="260" y2="470" stroke="#ffffff" stroke-width="1.2" opacity="0.2" />
<line x1="285" y1="70" x2="285" y2="470" stroke="#ffffff" stroke-width="1.2" opacity="0.2" />
<line x1="310" y1="70" x2="310" y2="470" stroke="#ffffff" stroke-width="1.2" opacity="0.2" />
<line x1="335" y1="70" x2="335" y2="470" stroke="#ffffff" stroke-width="1.2" opacity="0.2" />
<line x1="360" y1="70" x2="360" y2="470" stroke="#ffffff" stroke-width="1.2" opacity="0.2" />
<line x1="385" y1="70" x2="385" y2="470" stroke="#ffffff" stroke-width="1.2" opacity="0.2" />
<line x1="410" y1="70" x2="410" y2="470" stroke="#ffffff" stroke-width="1.2" opacity="0.2" />
<line x1="435" y1="70" x2="435" y2="470" stroke="#ffffff" stroke-width="1.2" opacity="0.2" />

    <!-- 3. 反光與3D陰影層 -->
    <circle cx="300" cy="270" r="190" fill="url(#sphere3DGrad)" style="mix-blend-mode: multiply;" />
  </g>
  
  <!-- 4. 高光 (Highlight) -->
  <ellipse cx="230" cy="180" rx="65" ry="38" transform="rotate(-30 230 180)" fill="#ffffff" opacity="0.65" filter="url(#glow)" />
  <circle cx="200" cy="150" r="15" fill="#ffffff" opacity="0.4" filter="url(#glow)" />
</svg>