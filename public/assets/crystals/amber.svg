<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- 背景：純白色 -->
  <rect width="600" height="600" fill="#ffffff" />
  
  <defs>
    <!-- 軟陰影漸層 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- 基礎 3D 遮罩，把內含物限制在圓圈內 -->
    <clipPath id="beadClip">
      <circle cx="300" cy="270" r="190" />
    </clipPath>
    
    <!-- 高光與立體感的 3D 覆蓋漸層 -->
    <radialGradient id="sphere3DGrad" cx="28%" cy="23%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="82%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
    </radialGradient>

    <!-- 高光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
    <radialGradient id="crystalBaseGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fffae0" />
      <stop offset="45%" stop-color="#ffb900" />
      <stop offset="100%" stop-color="#d35400" />
    </radialGradient>
      </defs>

  <!-- 軟陰影 -->
  <ellipse cx="300" cy="485" rx="140" ry="18" fill="url(#shadowGrad)" />

  <!-- 圓珠主體 -->
  <g clip-path="url(#beadClip)">
    <!-- 1. 基礎色 -->
    <circle cx="300" cy="270" r="190" fill="url(#crystalBaseGrad)" />
    
    <!-- 2. 特有的包體/紋理 -->
    <path d="M 270.8145951284678 192.11742995423265 Q 280.8145951284678 182.11742995423265 290.8145951284678 187.11742995423265" fill="none" stroke="#3e2723" stroke-width="2.5" opacity="0.65" stroke-linecap="round"/>
<path d="M 229.70890235286788 233.749136266415 Q 239.70890235286788 223.749136266415 249.70890235286788 228.749136266415" fill="none" stroke="#3e2723" stroke-width="2.5" opacity="0.65" stroke-linecap="round"/>
<path d="M 331.6068460357201 213.20968678643112 Q 341.6068460357201 203.20968678643112 351.6068460357201 208.20968678643112" fill="none" stroke="#3e2723" stroke-width="2.5" opacity="0.65" stroke-linecap="round"/>
<circle cx="320.8723235253274" cy="255.649394144275" r="5.824697744235891" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
<circle cx="319.8723235253274" cy="254.649394144275" r="1" fill="#ffffff" opacity="0.5"/>
<circle cx="380.0056734580721" cy="255.7456688569073" r="5.20200324805046" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
<circle cx="379.0056734580721" cy="254.7456688569073" r="1" fill="#ffffff" opacity="0.5"/>
<circle cx="381.2255638170427" cy="244.22012763345265" r="2.4437672007625224" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
<circle cx="380.2255638170427" cy="243.22012763345265" r="1" fill="#ffffff" opacity="0.5"/>
<circle cx="328.04607921716524" cy="283.5095274737978" r="5.267485264907009" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
<circle cx="327.04607921716524" cy="282.5095274737978" r="1" fill="#ffffff" opacity="0.5"/>
<circle cx="243.98728187825327" cy="269.9567999259398" r="3.222851736838493" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
<circle cx="242.98728187825327" cy="268.9567999259398" r="1" fill="#ffffff" opacity="0.5"/>

    <!-- 3. 反光與3D陰影層 -->
    <circle cx="300" cy="270" r="190" fill="url(#sphere3DGrad)" style="mix-blend-mode: multiply;" />
  </g>
  
  <!-- 4. 高光 (Highlight) -->
  <ellipse cx="230" cy="180" rx="65" ry="38" transform="rotate(-30 230 180)" fill="#ffffff" opacity="0.65" filter="url(#glow)" />
  <circle cx="200" cy="150" r="15" fill="#ffffff" opacity="0.4" filter="url(#glow)" />
</svg>