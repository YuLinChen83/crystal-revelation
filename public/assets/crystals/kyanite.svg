<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- 背景：純白色 -->
  <rect width="600" height="600" fill="#ffffff" />
  
  <defs>
    <!-- 軟陰影漸層 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- 基礎 3D 遮罩，把內含物限制在圓圈內 -->
    <clipPath id="beadClip">
      <circle cx="300" cy="270" r="190" />
    </clipPath>
    
    <!-- 高光與立體感的 3D 覆蓋漸層 -->
    <radialGradient id="sphere3DGrad" cx="28%" cy="23%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="82%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
    </radialGradient>

    <!-- 高光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
    <radialGradient id="crystalBaseGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#70a1ff" />
      <stop offset="50%" stop-color="#1e90ff" />
      <stop offset="100%" stop-color="#0f1d5c" />
    </radialGradient>
      </defs>

  <!-- 軟陰影 -->
  <ellipse cx="300" cy="485" rx="140" ry="18" fill="url(#shadowGrad)" />

  <!-- 圓珠主體 -->
  <g clip-path="url(#beadClip)">
    <!-- 1. 基礎色 -->
    <circle cx="300" cy="270" r="190" fill="url(#crystalBaseGrad)" />
    
    <!-- 2. 特有的包體/紋理 -->
    <line x1="-20" y1="80" x2="200" y2="460" stroke="#ffffff" stroke-width="3.415472290287653" opacity="0.16" stroke-linecap="round"/>
<line x1="-40" y1="100" x2="180" y2="480" stroke="#000000" stroke-width="1.5" opacity="0.12"/>
<line x1="15" y1="80" x2="235" y2="460" stroke="#ffffff" stroke-width="7.528503330948297" opacity="0.16" stroke-linecap="round"/>
<line x1="-5" y1="100" x2="215" y2="480" stroke="#000000" stroke-width="1.5" opacity="0.12"/>
<line x1="50" y1="80" x2="270" y2="460" stroke="#ffffff" stroke-width="6.345005840016029" opacity="0.16" stroke-linecap="round"/>
<line x1="30" y1="100" x2="250" y2="480" stroke="#000000" stroke-width="1.5" opacity="0.12"/>
<line x1="85" y1="80" x2="305" y2="460" stroke="#ffffff" stroke-width="3.424845314810227" opacity="0.16" stroke-linecap="round"/>
<line x1="65" y1="100" x2="285" y2="480" stroke="#000000" stroke-width="1.5" opacity="0.12"/>
<line x1="120" y1="80" x2="340" y2="460" stroke="#ffffff" stroke-width="4.981682574082697" opacity="0.16" stroke-linecap="round"/>
<line x1="100" y1="100" x2="320" y2="480" stroke="#000000" stroke-width="1.5" opacity="0.12"/>
<line x1="155" y1="80" x2="375" y2="460" stroke="#ffffff" stroke-width="3.9981266001136646" opacity="0.16" stroke-linecap="round"/>
<line x1="135" y1="100" x2="355" y2="480" stroke="#000000" stroke-width="1.5" opacity="0.12"/>
<line x1="190" y1="80" x2="410" y2="460" stroke="#ffffff" stroke-width="7.577005392775391" opacity="0.16" stroke-linecap="round"/>
<line x1="170" y1="100" x2="390" y2="480" stroke="#000000" stroke-width="1.5" opacity="0.12"/>
<line x1="225" y1="80" x2="445" y2="460" stroke="#ffffff" stroke-width="3.684768059486487" opacity="0.16" stroke-linecap="round"/>
<line x1="205" y1="100" x2="425" y2="480" stroke="#000000" stroke-width="1.5" opacity="0.12"/>

    <!-- 3. 反光與3D陰影層 -->
    <circle cx="300" cy="270" r="190" fill="url(#sphere3DGrad)" style="mix-blend-mode: multiply;" />
  </g>
  
  <!-- 4. 高光 (Highlight) -->
  <ellipse cx="230" cy="180" rx="65" ry="38" transform="rotate(-30 230 180)" fill="#ffffff" opacity="0.65" filter="url(#glow)" />
  <circle cx="200" cy="150" r="15" fill="#ffffff" opacity="0.4" filter="url(#glow)" />
</svg>