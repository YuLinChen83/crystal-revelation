<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- 背景：純白色 -->
  <rect width="600" height="600" fill="#ffffff" />
  
  <defs>
    <!-- 軟陰影漸層 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- 基礎 3D 遮罩，把內含物限制在圓圈內 -->
    <clipPath id="beadClip">
      <circle cx="300" cy="270" r="190" />
    </clipPath>
    
    <!-- 高光與立體感的 3D 覆蓋漸層 -->
    <radialGradient id="sphere3DGrad" cx="28%" cy="23%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="82%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
    </radialGradient>

    <!-- 高光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
    <radialGradient id="crystalBaseGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8e9eab" />
      <stop offset="60%" stop-color="#57606f" />
      <stop offset="100%" stop-color="#2f3542" />
    </radialGradient>
      </defs>

  <!-- 軟陰影 -->
  <ellipse cx="300" cy="485" rx="140" ry="18" fill="url(#shadowGrad)" />

  <!-- 圓珠主體 -->
  <g clip-path="url(#beadClip)">
    <!-- 1. 基礎色 -->
    <circle cx="300" cy="270" r="190" fill="url(#crystalBaseGrad)" />
    
    <!-- 2. 特有的包體/紋理 -->
    <line x1="-50" y1="80" x2="200" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="80" y1="-50" x2="480" y2="200" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="-5" y1="80" x2="245" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="80" y1="-5" x2="480" y2="245" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="40" y1="80" x2="290" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="80" y1="40" x2="480" y2="290" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="85" y1="80" x2="335" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="80" y1="85" x2="480" y2="335" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="130" y1="80" x2="380" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="80" y1="130" x2="480" y2="380" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="175" y1="80" x2="425" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="80" y1="175" x2="480" y2="425" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="220" y1="80" x2="470" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="80" y1="220" x2="480" y2="470" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="265" y1="80" x2="515" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="80" y1="265" x2="480" y2="515" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="310" y1="80" x2="560" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
<line x1="80" y1="310" x2="480" y2="560" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />

    <!-- 3. 反光與3D陰影層 -->
    <circle cx="300" cy="270" r="190" fill="url(#sphere3DGrad)" style="mix-blend-mode: multiply;" />
  </g>
  
  <!-- 4. 高光 (Highlight) -->
  <ellipse cx="230" cy="180" rx="65" ry="38" transform="rotate(-30 230 180)" fill="#ffffff" opacity="0.65" filter="url(#glow)" />
  <circle cx="200" cy="150" r="15" fill="#ffffff" opacity="0.4" filter="url(#glow)" />
</svg>