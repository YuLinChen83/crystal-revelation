<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- 背景：純白色 -->
  <rect width="600" height="600" fill="#ffffff" />
  
  <defs>
    <!-- 軟陰影漸層 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- 基礎 3D 遮罩，把內含物限制在圓圈內 -->
    <clipPath id="beadClip">
      <circle cx="300" cy="270" r="190" />
    </clipPath>
    
    <!-- 高光與立體感的 3D 覆蓋漸層 -->
    <radialGradient id="sphere3DGrad" cx="28%" cy="23%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="82%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
    </radialGradient>

    <!-- 高光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
    <radialGradient id="crystalBaseGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f5f6fa" />
      <stop offset="50%" stop-color="#badc58" />
      <stop offset="100%" stop-color="#4b6b1d" />
    </radialGradient>
      </defs>

  <!-- 軟陰影 -->
  <ellipse cx="300" cy="485" rx="140" ry="18" fill="url(#shadowGrad)" />

  <!-- 圓珠主體 -->
  <g clip-path="url(#beadClip)">
    <!-- 1. 基礎色 -->
    <circle cx="300" cy="270" r="190" fill="url(#crystalBaseGrad)" />
    
    <!-- 2. 特有的包體/紋理 -->
    <line x1="267.9884976402536" y1="163.47772950037324" x2="241.85961814400798" y2="170.3933896797389" stroke="#1e272e" stroke-width="1.2" opacity="0.8" stroke-linecap="round"/>
<line x1="280.328780606651" y1="383.407713851484" x2="252.22630179167027" y2="392.35963359838934" stroke="#1e272e" stroke-width="1.2" opacity="0.8" stroke-linecap="round"/>
<line x1="238.98445028975402" y1="256.47303813690087" x2="211.83623725581128" y2="217.4077317485353" stroke="#1e272e" stroke-width="1.2" opacity="0.8" stroke-linecap="round"/>
<line x1="336.646275769308" y1="244.05900232450222" x2="338.34748918070545" y2="217.79677985639864" stroke="#1e272e" stroke-width="1.2" opacity="0.8" stroke-linecap="round"/>
<line x1="256.3200995087391" y1="233.4637533702562" x2="255.38202160270885" y2="211.2396574542663" stroke="#1e272e" stroke-width="1.2" opacity="0.8" stroke-linecap="round"/>
<line x1="280.8109335426707" y1="360.60985730946413" x2="308.73346048840176" y2="342.83024644479156" stroke="#1e272e" stroke-width="1.2" opacity="0.8" stroke-linecap="round"/>

    <!-- 3. 反光與3D陰影層 -->
    <circle cx="300" cy="270" r="190" fill="url(#sphere3DGrad)" style="mix-blend-mode: multiply;" />
  </g>
  
  <!-- 4. 高光 (Highlight) -->
  <ellipse cx="230" cy="180" rx="65" ry="38" transform="rotate(-30 230 180)" fill="#ffffff" opacity="0.65" filter="url(#glow)" />
  <circle cx="200" cy="150" r="15" fill="#ffffff" opacity="0.4" filter="url(#glow)" />
</svg>