<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- 背景：純白色 -->
  <rect width="600" height="600" fill="#ffffff" />
  
  <defs>
    <!-- 軟陰影漸層 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- 基礎 3D 遮罩，把內含物限制在圓圈內 -->
    <clipPath id="beadClip">
      <circle cx="300" cy="270" r="190" />
    </clipPath>
    
    <!-- 高光與立體感的 3D 覆蓋漸層 -->
    <radialGradient id="sphere3DGrad" cx="28%" cy="23%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="82%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
    </radialGradient>

    <!-- 高光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
    <radialGradient id="crystalBaseGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f5f6fa" />
      <stop offset="100%" stop-color="#e5e7eb" />
    </radialGradient>
      </defs>

  <!-- 軟陰影 -->
  <ellipse cx="300" cy="485" rx="140" ry="18" fill="url(#shadowGrad)" />

  <!-- 圓珠主體 -->
  <g clip-path="url(#beadClip)">
    <!-- 1. 基礎色 -->
    <circle cx="300" cy="270" r="190" fill="url(#crystalBaseGrad)" />
    
    <!-- 2. 特有的包體/紋理 -->
    <line x1="50" y1="80" x2="200" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="66" y1="80" x2="216" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="82" y1="80" x2="232" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="98" y1="80" x2="248" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="114" y1="80" x2="264" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="130" y1="80" x2="280" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="146" y1="80" x2="296" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="162" y1="80" x2="312" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="178" y1="80" x2="328" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="194" y1="80" x2="344" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="210" y1="80" x2="360" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="226" y1="80" x2="376" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="242" y1="80" x2="392" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="258" y1="80" x2="408" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="274" y1="80" x2="424" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="290" y1="80" x2="440" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="306" y1="80" x2="456" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="322" y1="80" x2="472" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="338" y1="80" x2="488" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
<line x1="354" y1="80" x2="504" y2="460" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />

    <!-- 3. 反光與3D陰影層 -->
    <circle cx="300" cy="270" r="190" fill="url(#sphere3DGrad)" style="mix-blend-mode: multiply;" />
  </g>
  
  <!-- 4. 高光 (Highlight) -->
  <ellipse cx="230" cy="180" rx="65" ry="38" transform="rotate(-30 230 180)" fill="#ffffff" opacity="0.65" filter="url(#glow)" />
  <circle cx="200" cy="150" r="15" fill="#ffffff" opacity="0.4" filter="url(#glow)" />
</svg>