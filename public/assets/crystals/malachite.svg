<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- 背景：純白色 -->
  <rect width="600" height="600" fill="#ffffff" />
  
  <defs>
    <!-- 軟陰影漸層 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- 基礎 3D 遮罩，把內含物限制在圓圈內 -->
    <clipPath id="beadClip">
      <circle cx="300" cy="270" r="190" />
    </clipPath>
    
    <!-- 高光與立體感的 3D 覆蓋漸層 -->
    <radialGradient id="sphere3DGrad" cx="28%" cy="23%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="82%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
    </radialGradient>

    <!-- 高光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
    <radialGradient id="crystalBaseGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2ed573" />
      <stop offset="100%" stop-color="#019031" />
    </radialGradient>
      </defs>

  <!-- 軟陰影 -->
  <ellipse cx="300" cy="485" rx="140" ry="18" fill="url(#shadowGrad)" />

  <!-- 圓珠主體 -->
  <g clip-path="url(#beadClip)">
    <!-- 1. 基礎色 -->
    <circle cx="300" cy="270" r="190" fill="url(#crystalBaseGrad)" />
    
    <!-- 2. 特有的包體/紋理 -->
    <circle cx="260" cy="290" r="50" fill="none" stroke="#0c4224" stroke-width="4.522627571845078" opacity="0.45" stroke-dasharray="401.5731272751509 135.1853774652227"/>
<circle cx="340" cy="220" r="70" fill="none" stroke="#7bed9f" stroke-width="2" opacity="0.3"/>
<circle cx="260" cy="290" r="88" fill="none" stroke="#0c4224" stroke-width="4.779245793550217" opacity="0.45" stroke-dasharray="567.3283140731655 68.90636005891793"/>
<circle cx="340" cy="220" r="108" fill="none" stroke="#7bed9f" stroke-width="2" opacity="0.3"/>
<circle cx="260" cy="290" r="126" fill="none" stroke="#0c4224" stroke-width="7.783998926439381" opacity="0.45" stroke-dasharray="561.2896786093188 141.55377210117877"/>
<circle cx="340" cy="220" r="146" fill="none" stroke="#7bed9f" stroke-width="2" opacity="0.3"/>
<circle cx="260" cy="290" r="164" fill="none" stroke="#0c4224" stroke-width="7.0559841168469575" opacity="0.45" stroke-dasharray="305.8284379312681 120.34088356008397"/>
<circle cx="340" cy="220" r="184" fill="none" stroke="#7bed9f" stroke-width="2" opacity="0.3"/>
<circle cx="260" cy="290" r="202" fill="none" stroke="#0c4224" stroke-width="4.805946208809473" opacity="0.45" stroke-dasharray="425.8243690006566 110.32487568418219"/>
<circle cx="340" cy="220" r="222" fill="none" stroke="#7bed9f" stroke-width="2" opacity="0.3"/>

    <!-- 3. 反光與3D陰影層 -->
    <circle cx="300" cy="270" r="190" fill="url(#sphere3DGrad)" style="mix-blend-mode: multiply;" />
  </g>
  
  <!-- 4. 高光 (Highlight) -->
  <ellipse cx="230" cy="180" rx="65" ry="38" transform="rotate(-30 230 180)" fill="#ffffff" opacity="0.65" filter="url(#glow)" />
  <circle cx="200" cy="150" r="15" fill="#ffffff" opacity="0.4" filter="url(#glow)" />
</svg>