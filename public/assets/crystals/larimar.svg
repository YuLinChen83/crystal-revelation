<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- 背景：純白色 -->
  <rect width="600" height="600" fill="#ffffff" />
  
  <defs>
    <!-- 軟陰影漸層 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- 基礎 3D 遮罩，把內含物限制在圓圈內 -->
    <clipPath id="beadClip">
      <circle cx="300" cy="270" r="190" />
    </clipPath>
    
    <!-- 高光與立體感的 3D 覆蓋漸層 -->
    <radialGradient id="sphere3DGrad" cx="28%" cy="23%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="82%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
    </radialGradient>

    <!-- 高光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
    <radialGradient id="crystalBaseGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e0f7fa" />
      <stop offset="50%" stop-color="#4fc3f7" />
      <stop offset="100%" stop-color="#0288d1" />
    </radialGradient>
      </defs>

  <!-- 軟陰影 -->
  <ellipse cx="300" cy="485" rx="140" ry="18" fill="url(#shadowGrad)" />

  <!-- 圓珠主體 -->
  <g clip-path="url(#beadClip)">
    <!-- 1. 基礎色 -->
    <circle cx="300" cy="270" r="190" fill="url(#crystalBaseGrad)" />
    
    <!-- 2. 特有的包體/紋理 -->
    <path d="M 100 120 Q 200 90 300 120 T 500 120" fill="none" stroke="#ffffff" stroke-width="7.24144902259286" opacity="0.42" stroke-linecap="round" filter="url(#glow)"/>
<path d="M 120 140 Q 220 110 320 140 T 480 140" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
<path d="M 100 180 Q 200 150 300 180 T 500 180" fill="none" stroke="#ffffff" stroke-width="4.394957972109296" opacity="0.42" stroke-linecap="round" filter="url(#glow)"/>
<path d="M 120 200 Q 220 170 320 200 T 480 200" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
<path d="M 100 240 Q 200 210 300 240 T 500 240" fill="none" stroke="#ffffff" stroke-width="6.195439742761664" opacity="0.42" stroke-linecap="round" filter="url(#glow)"/>
<path d="M 120 260 Q 220 230 320 260 T 480 260" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
<path d="M 100 300 Q 200 270 300 300 T 500 300" fill="none" stroke="#ffffff" stroke-width="7.102007641136879" opacity="0.42" stroke-linecap="round" filter="url(#glow)"/>
<path d="M 120 320 Q 220 290 320 320 T 480 320" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
<path d="M 100 360 Q 200 330 300 360 T 500 360" fill="none" stroke="#ffffff" stroke-width="4.131032056451659" opacity="0.42" stroke-linecap="round" filter="url(#glow)"/>
<path d="M 120 380 Q 220 350 320 380 T 480 380" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
<path d="M 100 420 Q 200 390 300 420 T 500 420" fill="none" stroke="#ffffff" stroke-width="4.397184631998243" opacity="0.42" stroke-linecap="round" filter="url(#glow)"/>
<path d="M 120 440 Q 220 410 320 440 T 480 440" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>

    <!-- 3. 反光與3D陰影層 -->
    <circle cx="300" cy="270" r="190" fill="url(#sphere3DGrad)" style="mix-blend-mode: multiply;" />
  </g>
  
  <!-- 4. 高光 (Highlight) -->
  <ellipse cx="230" cy="180" rx="65" ry="38" transform="rotate(-30 230 180)" fill="#ffffff" opacity="0.65" filter="url(#glow)" />
  <circle cx="200" cy="150" r="15" fill="#ffffff" opacity="0.4" filter="url(#glow)" />
</svg>