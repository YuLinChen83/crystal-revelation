<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- 背景：純白色 -->
  <rect width="600" height="600" fill="#ffffff" />
  
  <defs>
    <!-- 軟陰影漸層 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- 基礎 3D 遮罩，把內含物限制在圓圈內 -->
    <clipPath id="beadClip">
      <circle cx="300" cy="270" r="190" />
    </clipPath>
    
    <!-- 高光與立體感的 3D 覆蓋漸層 -->
    <radialGradient id="sphere3DGrad" cx="28%" cy="23%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="82%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
    </radialGradient>

    <!-- 高光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
    <radialGradient id="crystalBaseGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff0f5" />
      <stop offset="50%" stop-color="#ffccd5" />
      <stop offset="100%" stop-color="#e5989b" />
    </radialGradient>
      </defs>

  <!-- 軟陰影 -->
  <ellipse cx="300" cy="485" rx="140" ry="18" fill="url(#shadowGrad)" />

  <!-- 圓珠主體 -->
  <g clip-path="url(#beadClip)">
    <!-- 1. 基礎色 -->
    <circle cx="300" cy="270" r="190" fill="url(#crystalBaseGrad)" />
    
    <!-- 2. 特有的包體/紋理 -->
    <circle cx="262.30423556517053" cy="210.22341506806697" r="19.605366301559116" fill="#ffffff" opacity="0.45" filter="url(#glow)"/>
<ellipse cx="267.30423556517053" cy="215.22341506806697" rx="9.331565428328759" ry="4.298833199545697" transform="rotate(269.5425271960312 267.30423556517053 215.22341506806697)" fill="#ffeef2" opacity="0.55" filter="url(#glow)"/>
<circle cx="384.73107177051133" cy="187.8845053216719" r="18.134180146818835" fill="#ffffff" opacity="0.45" filter="url(#glow)"/>
<ellipse cx="389.73107177051133" cy="192.8845053216719" rx="7.95181882727411" ry="5.475074933995529" transform="rotate(189.66229271147313 389.73107177051133 192.8845053216719)" fill="#ffeef2" opacity="0.55" filter="url(#glow)"/>
<circle cx="210.63975307019973" cy="192.57747147523332" r="21.292567118527586" fill="#ffffff" opacity="0.45" filter="url(#glow)"/>
<ellipse cx="215.63975307019973" cy="197.57747147523332" rx="8.104915086660185" ry="3.2654461090786526" transform="rotate(55.572080946503775 215.63975307019973 197.57747147523332)" fill="#ffeef2" opacity="0.55" filter="url(#glow)"/>
<circle cx="243.9097989074071" cy="345.8669558892507" r="13.259774986233424" fill="#ffffff" opacity="0.45" filter="url(#glow)"/>
<ellipse cx="248.9097989074071" cy="350.8669558892507" rx="6.3292024210259115" ry="4.4692834713123375" transform="rotate(141.4529937941552 248.9097989074071 350.8669558892507)" fill="#ffeef2" opacity="0.55" filter="url(#glow)"/>
<circle cx="244.23959665036818" cy="275.3978434711098" r="18.89757666479636" fill="#ffffff" opacity="0.45" filter="url(#glow)"/>
<ellipse cx="249.23959665036818" cy="280.3978434711098" rx="6.1731017514903215" ry="3.4505263446917525" transform="rotate(104.02693583040673 249.23959665036818 280.3978434711098)" fill="#ffeef2" opacity="0.55" filter="url(#glow)"/>
<circle cx="343.461259243486" cy="270.1910484741529" r="18.219865727452998" fill="#ffffff" opacity="0.45" filter="url(#glow)"/>
<ellipse cx="348.461259243486" cy="275.1910484741529" rx="9.148684776087975" ry="4.0789315408947004" transform="rotate(175.80002798258647 348.461259243486 275.1910484741529)" fill="#ffeef2" opacity="0.55" filter="url(#glow)"/>

    <!-- 3. 反光與3D陰影層 -->
    <circle cx="300" cy="270" r="190" fill="url(#sphere3DGrad)" style="mix-blend-mode: multiply;" />
  </g>
  
  <!-- 4. 高光 (Highlight) -->
  <ellipse cx="230" cy="180" rx="65" ry="38" transform="rotate(-30 230 180)" fill="#ffffff" opacity="0.65" filter="url(#glow)" />
  <circle cx="200" cy="150" r="15" fill="#ffffff" opacity="0.4" filter="url(#glow)" />
</svg>