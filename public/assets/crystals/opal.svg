<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- 背景：純白色 -->
  <rect width="600" height="600" fill="#ffffff" />
  
  <defs>
    <!-- 軟陰影漸層 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- 基礎 3D 遮罩，把內含物限制在圓圈內 -->
    <clipPath id="beadClip">
      <circle cx="300" cy="270" r="190" />
    </clipPath>
    
    <!-- 高光與立體感的 3D 覆蓋漸層 -->
    <radialGradient id="sphere3DGrad" cx="28%" cy="23%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="82%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
    </radialGradient>

    <!-- 高光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
    <radialGradient id="crystalBaseGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f2f6" />
      <stop offset="100%" stop-color="#dcdde1" />
    </radialGradient>
    
        <radialGradient id="opalGrad_0" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#55efc4" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
      
        <radialGradient id="opalGrad_1" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffeaa7" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
      
        <radialGradient id="opalGrad_2" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ff7675" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
      
        <radialGradient id="opalGrad_3" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#74b9ff" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
      
        <radialGradient id="opalGrad_4" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#a55eea" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
      
        <radialGradient id="opalGrad_5" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#55efc4" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        </defs>

  <!-- 軟陰影 -->
  <ellipse cx="300" cy="485" rx="140" ry="18" fill="url(#shadowGrad)" />

  <!-- 圓珠主體 -->
  <g clip-path="url(#beadClip)">
    <!-- 1. 基礎色 -->
    <circle cx="300" cy="270" r="190" fill="url(#crystalBaseGrad)" />
    
    <!-- 2. 特有的包體/紋理 -->
    <ellipse cx="252.98986900270393" cy="186.76792460184515" rx="44.05058805155477" ry="34.291288283802714" transform="rotate(177.10204918003 252.98986900270393 186.76792460184515)" fill="url(#opalGrad_0)" filter="url(#glow)"/>
<ellipse cx="256.95216865933617" cy="350.9112910499607" rx="60.54965324991613" ry="28.547615397093296" transform="rotate(41.09615706587647 256.95216865933617 350.9112910499607)" fill="url(#opalGrad_1)" filter="url(#glow)"/>
<ellipse cx="390.61280520254513" cy="349.7911685148392" rx="61.20563046951247" ry="20.126365818323393" transform="rotate(123.48241446166867 390.61280520254513 349.7911685148392)" fill="url(#opalGrad_2)" filter="url(#glow)"/>
<ellipse cx="395.3747720894171" cy="342.4420922837453" rx="72.28921882457996" ry="44.049465441016764" transform="rotate(84.20610394976393 395.3747720894171 342.4420922837453)" fill="url(#opalGrad_3)" filter="url(#glow)"/>
<ellipse cx="382.0486978544068" cy="213.05311003268457" rx="71.48116025503441" ry="29.717626383808238" transform="rotate(152.8945954309529 382.0486978544068 213.05311003268457)" fill="url(#opalGrad_4)" filter="url(#glow)"/>
<ellipse cx="339.07311975772245" cy="294.66000532185717" rx="70.11855532923619" ry="20.58178981799756" transform="rotate(115.14545127325619 339.07311975772245 294.66000532185717)" fill="url(#opalGrad_5)" filter="url(#glow)"/>

    <!-- 3. 反光與3D陰影層 -->
    <circle cx="300" cy="270" r="190" fill="url(#sphere3DGrad)" style="mix-blend-mode: multiply;" />
  </g>
  
  <!-- 4. 高光 (Highlight) -->
  <ellipse cx="230" cy="180" rx="65" ry="38" transform="rotate(-30 230 180)" fill="#ffffff" opacity="0.65" filter="url(#glow)" />
  <circle cx="200" cy="150" r="15" fill="#ffffff" opacity="0.4" filter="url(#glow)" />
</svg>