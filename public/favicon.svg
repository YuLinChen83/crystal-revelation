<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- 切面 1：左上 (極淡霧霾藍) -->
  <path d="M16 10 L6 20 L16 20 Z" fill="rgba(197, 213, 228, 0.35)" />
  <!-- 切面 2：右上 (極淡灰藕粉) -->
  <path d="M16 10 L16 20 L26 20 Z" fill="rgba(224, 206, 205, 0.35)" />
