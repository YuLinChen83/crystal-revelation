  <path d="M6 20 L26 20" stroke="#57606f" stroke-width="1.2" stroke-linecap="round" />
  
  <!-- 頂部空靈星芒 -->
  <line x1="16" y1="1" x2="16" y2="7" stroke="#57606f" stroke-width="1.2" stroke-linecap="round" />
  <line x1="13" y1="4" x2="19" y2="4" stroke="#57606f" stroke-width="1.2" stroke-linecap="round" />
